<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My SkyBlock Loadout</title>
<style>
  :root { --bg:#16181e; --text:#e8e8e8; --muted:#9aa0aa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Courier New",monospace;
         display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:24px; margin:6px 0 2px; letter-spacing:1px; color:#ffcc33; text-shadow:2px 2px #3f2f00; }
  .sub { margin:0 0 12px; color:var(--muted); font-size:13px; text-align:center; }
  #scene { width:100%; max-width:960px; image-rendering:pixelated; border:4px solid #000; display:block; }
  .bar-wrap { display:flex; align-items:flex-end; gap:10px; margin-top:14px; max-width:100%; flex-wrap:wrap; justify-content:center; }
  .hotbar { display:flex; background:#000; padding:3px; border:2px solid #555; }
  .slot { position:relative; width:clamp(30px,9vw,56px); aspect-ratio:1; background:#373737; margin:1px;
          border:3px solid; border-color:#1f1f1f #8b8b8b #8b8b8b #1f1f1f; cursor:pointer; overflow:hidden; }
  .slot.sel { outline:3px solid #fff; outline-offset:-1px; z-index:1; }
  .slot canvas { width:100%; height:100%; display:block; }
  .slot { background:radial-gradient(circle at 50% 45%,#4a4a4a,#2f2f2f); }
  .slot .n { position:absolute; left:2px; top:0; font-size:10px; color:#aaa; }
  .slot.ench::after { content:""; position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen;
          background:linear-gradient(115deg,transparent 30%,rgba(170,90,255,.55) 45%,transparent 60%);
          background-size:300% 100%; animation:glint 3s linear infinite; }
  @keyframes glint { from{background-position:150% 0} to{background-position:-150% 0} }
  .off { text-align:center; font-size:11px; color:var(--muted); }
  #tip { position:fixed; pointer-events:none; display:none; background:rgba(16,0,16,.94);
         border:2px solid #2d0a63; outline:2px solid rgba(16,0,16,.94); padding:6px 9px; font-size:14px;
         line-height:1.35; max-width:280px; z-index:10; }
  #tip .g { color:#aaa; } #tip .b { color:#55ffff; } #tip .e { color:#5555ff; }
  .gear { max-width:960px; width:100%; margin-top:18px; display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; }
  .card { background:#22252d; border:2px solid #333844; padding:10px; font-size:13px; }
  .card b { display:block; margin-bottom:4px; }
</style>
</head>
<body>
<h1>Bazaar Alley — F7 Ready</h1>
<p class="sub">Hypixel SkyBlock fan page · hover (or tap) a slot to see the item</p>
 
<canvas id="scene" width="960" height="540"></canvas>
 
<div class="bar-wrap">
  <div><div class="hotbar" id="off"></div><div class="off">offhand</div></div>
  <div class="hotbar" id="bar"></div>
</div>
 
<div class="gear">
  <div class="card"><b style="color:#ffaa00">You</b>Giant Goldor's Armor (full set) · F7 loadout</div>
  <div class="card"><b style="color:#55ffff">Vallon's</b>Divan's Armor · Divan's Drill</div>
  <div class="card"><b style="color:#ff5555">Reborn Gold</b>Necron's Armor · Dark Claymore</div>
  <div class="card"><b style="color:#5599ff">Doggy</b>Shark Scale Armor · Challenging Rod</div>
</div>
 
<div id="tip"></div>
 
<script>
/* ---------- pixel icon drawing (original art, 16x16) ---------- */
// upscale to 32px, add bevel shading + dark outline for a crisper, more detailed look
function finish(src){
  const c=document.createElement('canvas'); c.width=c.height=34; const g=c.getContext('2d');
  g.imageSmoothingEnabled=false; g.drawImage(src,1,1,32,32);
  const d=g.getImageData(0,0,34,34), a=d.data, out=new Uint8ClampedArray(a);
  const A=(x,y)=>(x<0||y<0||x>33||y>33)?0:a[(y*34+x)*4+3];
  for(let y=0;y<34;y++)for(let x=0;x<34;x++){ const i=(y*34+x)*4;
    if(a[i+3]){ let f=1;
      if(!A(x,y-1)||!A(x-1,y)) f=1.35; else if(!A(x,y+1)||!A(x+1,y)) f=0.65;
      else f=0.92+(((x>>1)*7+(y>>1)*13)%5)*0.04;   // per-pixel grain like game textures
      for(let k=0;k<3;k++) out[i+k]=Math.min(255,a[i+k]*f); }
    else if(A(x-1,y)||A(x+1,y)||A(x,y-1)||A(x,y+1)){ out[i]=14; out[i+1]=8; out[i+2]=20; out[i+3]=255; } }
  g.putImageData(new ImageData(out,34,34),0,0); return c;
}
function makeIcon(fn){ const c=document.createElement('canvas'); c.width=c.height=16;
  const g=c.getContext('2d'); const p=(x,y,col)=>{g.fillStyle=col; g.fillRect(x,y,1,1);}; fn(p,g); return finish(c); }
 
function sword(o){ return makeIcon(p=>{
  const len=o.len||9, w=o.wide?1:0;
  for(let i=0;i<len;i++){ const x=5+i, y=10-i; p(x,y,o.blade); p(x+1,y,o.edge); if(w){p(x,y-1,o.edge); p(x+1,y-1,o.blade);} }
  p(5+len,10-len,o.edge);
  [[4,11],[3,10],[5,12],[2,9],[6,13]].forEach(([x,y],i)=>p(x,y,i<1?o.gem||o.guard:o.guard));
  [[3,12],[2,13],[1,14]].forEach(([x,y])=>p(x,y,o.grip)); p(0,15,o.pommel||o.guard);
});}
function katana(o){ return makeIcon(p=>{
  for(let i=0;i<10;i++){ p(5+i,10-i,o.blade); if(i<9)p(6+i,10-i,o.edge); }
  [[4,10],[5,11],[4,11]].forEach(([x,y])=>p(x,y,o.guard));
  [[3,12],[2,13],[1,14],[0,15]].forEach(([x,y],i)=>p(x,y,i%2?o.grip:o.wrap));
});}
function wand(o){ return makeIcon(p=>{
  for(let i=0;i<9;i++){ p(2+i,13-i,o.stick); }
  for(let x=10;x<14;x++)for(let y=2;y<6;y++) p(x,y,(x+y)%3?o.gem:o.shine);
  p(11,3,'#ffffff');
});}
function orb(o){ return makeIcon(p=>{
  for(let x=0;x<16;x++)for(let y=0;y<16;y++){ const d=Math.hypot(x-7.5,y-7.5);
    if(d<6.2) p(x,y,d>5?o.dark:(d>3?o.mid:o.light)); }
  p(5,5,'#ffffff'); p(6,5,'#ffffff'); p(5,6,'#ffffff');
});}
function bow(o){ return makeIcon(p=>{
  for(let a=0;a<=90;a+=4){ const r=a*Math.PI/180; p(Math.round(2+12*Math.cos(r)),Math.round(14-12*Math.sin(r)),a%20?o.wood:o.trim); }
  for(let i=3;i<14;i++) p(i,i,o.string);
  p(7,9,o.gem); p(8,8,o.gem);
});}
function book(o){ return makeIcon(p=>{
  for(let x=3;x<13;x++)for(let y=2;y<14;y++) p(x,y,x===3?o.spine:o.cover);
  for(let y=3;y<13;y++) p(12,y,'#e8e0c8');
  for(let x=6;x<10;x++)for(let y=6;y<10;y++) p(x,y,(x+y)%2?o.rune:o.cover);
});}
function mask(o){ return makeIcon(p=>{
  for(let y=2;y<15;y++){ const half=y<4?4:(y>12?3:6); for(let x=8-half;x<8+half;x++) p(x,y,o.face); }
  [[4,6],[5,6],[10,6],[11,6],[4,7],[5,7],[10,7],[11,7]].forEach(([x,y])=>p(x,y,o.eye));
  for(let x=5;x<11;x++) p(x,11,o.line);
});}
function rod(o){ return makeIcon(p=>{
  for(let i=0;i<12;i++) p(1+i,14-i,i<3?o.grip:o.stick);
  for(let y=3;y<12;y++) p(13,y,'#dddddd'); p(12,12,'#888'); p(13,12,'#888');
});}
 
/* ---------- detailed item art (64x64, smooth shading) ---------- */
function rng(s){ return ()=>{ s=(s*16807)%2147483647; return s/2147483647; }; }
function art(fn){ const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d'); x.save(); fn(x); x.restore(); return c; }
function grad(x,x0,y0,x1,y1,st){ const gr=x.createLinearGradient(x0,y0,x1,y1); st.forEach(([o,c])=>gr.addColorStop(o,c)); return gr; }
function rad(x,cx,cy,r0,r1,st,fx,fy){ const gr=x.createRadialGradient(fx??cx,fy??cy,r0,cx,cy,r1); st.forEach(([o,c])=>gr.addColorStop(o,c)); return gr; }
function diag(x){ x.translate(32,32); x.rotate(Math.PI/4); }    // draw tip-up on the axis; ends up pointing top-right
function sh(x){ x.shadowColor='rgba(0,0,0,.55)'; x.shadowBlur=3; x.shadowOffsetX=1.5; x.shadowOffsetY=1.5; }
function noSh(x){ x.shadowColor='transparent'; }
function rr(x,X,Y,W,H,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); }
function speckle(x,n,col,seed,a){ const r=rng(seed); x.fillStyle=col;
  for(let i=0;i<n;i++){ x.globalAlpha=0.12+r()*0.35; x.fillRect(a[0]+r()*a[2],a[1]+r()*a[3],0.8+r()*1.4,0.8+r()*1.4); } x.globalAlpha=1; }
function gemDot(x,cx,cy,r,c){ x.fillStyle=rad(x,cx,cy,0.3,r+0.5,[[0,'#fff'],[.4,c],[1,shade(c,.4)]],cx-r*0.35,cy-r*0.35); x.beginPath(); x.arc(cx,cy,r,0,7); x.fill(); }
 
function hilt(x,o){
  const gw=o.gw||20; x.strokeStyle='rgba(0,0,0,.75)'; x.lineWidth=1;
  x.fillStyle=grad(x,0,8,0,13,[[0,shade(o.guard,1.5)],[.5,o.guard],[1,shade(o.guard,.5)]]);
  rr(x,-gw/2,8,gw,5,2); x.fill(); x.stroke();
  if(o.gem){ gemDot(x,0,10.5,2.8,o.gem); x.beginPath(); x.arc(0,10.5,2.8,0,7); x.stroke(); }
  x.fillStyle=grad(x,-3,0,3,0,[[0,shade(o.grip,1.4)],[1,shade(o.grip,.55)]]); x.fillRect(-2.6,13,5.2,15);
  x.strokeStyle=shade(o.grip,.4); for(let y=14;y<27;y+=3){ x.beginPath(); x.moveTo(-2.6,y); x.lineTo(2.6,y+2); x.stroke(); }
  x.strokeStyle='rgba(0,0,0,.75)'; x.strokeRect(-2.6,13,5.2,15);
  x.fillStyle=rad(x,0,31,0.5,4.5,[[0,shade(o.guard,1.7)],[.5,o.guard],[1,shade(o.guard,.45)]],-1,30); x.beginPath(); x.arc(0,31,3.8,0,7); x.fill(); x.stroke();
}
// two-tone beveled blade: lit half, shadowed half, center ridge, fuller groove and an edge glint
function bladeArt(o){ return art(x=>{
  diag(x); const w=o.w||7, t=-38, b=8;
  const half=s=>{ x.beginPath(); x.moveTo(0,t); x.lineTo(s*w/2,t+w*1.3); x.lineTo(s*w/2,b); x.lineTo(0,b); x.closePath(); };
  x.save(); sh(x); if(o.glow){ x.shadowColor=o.glow; x.shadowBlur=9; x.shadowOffsetX=0; x.shadowOffsetY=0; }
  half(-1); x.fillStyle=grad(x,-w/2,0,0,0,[[0,o.edge],[1,o.light]]); x.fill();
  half(1);  x.fillStyle=grad(x,0,0,w/2,0,[[0,o.mid],[1,o.dark]]); x.fill(); x.restore();
  x.beginPath(); x.moveTo(0,t); x.lineTo(-w/2,t+w*1.3); x.lineTo(-w/2,b); x.lineTo(w/2,b); x.lineTo(w/2,t+w*1.3); x.closePath();
  x.strokeStyle='rgba(10,8,20,.9)'; x.lineWidth=1.2; x.stroke();
  if(o.fuller){ x.strokeStyle='rgba(0,0,0,.35)'; x.lineWidth=1.5; x.beginPath(); x.moveTo(-1.2,t+w*1.7); x.lineTo(-1.2,b-3); x.stroke(); }
  x.strokeStyle='rgba(255,255,255,.75)'; x.lineWidth=.8; x.beginPath(); x.moveTo(0,t+2); x.lineTo(0,b-1); x.stroke();
  x.fillStyle='rgba(255,255,255,.9)'; x.fillRect(-w/2+0.8,t+w*1.5,0.9,11);
  hilt(x,o);
});}
function katanaArt(o){ return art(x=>{
  diag(x); x.save(); sh(x);
  const edge=()=>{ x.beginPath(); x.moveTo(-2,8); x.quadraticCurveTo(-3.8,-14,2,-38); x.quadraticCurveTo(2.6,-14,2.6,8); x.closePath(); };
  edge(); x.fillStyle=grad(x,-3,0,3,0,[[0,'#ffffff'],[.4,o.blade],[1,shade(o.blade,.5)]]); x.fill(); x.restore();
  edge(); x.strokeStyle='rgba(10,10,20,.85)'; x.lineWidth=1; x.stroke();
  x.strokeStyle='rgba(255,255,255,.8)'; x.lineWidth=.7; x.beginPath();               // wavy temper line
  for(let y=6;y>-30;y-=3) x.lineTo(-1.1+((y/3)%2?0.5:-0.2)+y*0.02,y); x.stroke();
  x.strokeStyle='rgba(0,0,0,.8)';
  x.fillStyle=rad(x,0,10,1,7,[[0,shade(o.guard,1.6)],[.6,o.guard],[1,shade(o.guard,.4)]]); x.beginPath(); x.ellipse(0,10,7,2.6,0,0,7); x.fill(); x.stroke();
  x.fillStyle=o.grip; x.fillRect(-2.4,12.5,4.8,19); x.strokeRect(-2.4,12.5,4.8,19);
  x.fillStyle=o.wrap; for(let y=13;y<30;y+=4){ x.beginPath(); x.moveTo(0,y); x.lineTo(2.4,y+2); x.lineTo(0,y+4); x.lineTo(-2.4,y+2); x.closePath(); x.fill(); }
  x.fillStyle=o.guard; x.fillRect(-2.8,31,5.6,2.6); x.strokeRect(-2.8,31,5.6,2.6);
});}
function wandArt(o){ return art(x=>{
  diag(x); x.save(); sh(x);
  x.fillStyle=grad(x,-2,0,2,0,[[0,shade(o.stick,1.35)],[1,shade(o.stick,.5)]]); x.fillRect(-1.8,-18,3.6,49); x.restore();
  x.strokeStyle='rgba(0,0,0,.75)'; x.lineWidth=1; x.strokeRect(-1.8,-18,3.6,49);
  [-14,4,24].forEach(y=>{ x.fillStyle=grad(x,0,y,0,y+3,[[0,'#fff3a0'],[1,'#8a6d12']]); x.fillRect(-2.7,y,5.4,3); x.strokeRect(-2.7,y,5.4,3); });
  x.strokeStyle='#d4a017'; x.lineWidth=1.6; x.beginPath(); x.moveTo(-1.5,-18); x.quadraticCurveTo(-8,-26,-3,-33); x.moveTo(1.5,-18); x.quadraticCurveTo(8,-26,3,-33); x.stroke();
  const P=[[0,-39],[5.5,-29],[0,-20],[-5.5,-29]], path=()=>{ x.beginPath(); P.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p)); x.closePath(); };
  x.save(); x.shadowColor=o.gem; x.shadowBlur=11; path(); x.fillStyle=o.gem; x.fill(); x.restore();
  x.fillStyle=shade(o.gem,1.55); x.beginPath(); x.moveTo(0,-39); x.lineTo(-5.5,-29); x.lineTo(0,-29); x.closePath(); x.fill();
  x.fillStyle=shade(o.gem,.55); x.beginPath(); x.moveTo(0,-20); x.lineTo(5.5,-29); x.lineTo(0,-29); x.closePath(); x.fill();
  path(); x.strokeStyle='rgba(0,0,0,.8)'; x.stroke();
});}
function orbArt(o){ return art(x=>{
  x.save(); x.shadowColor=o.glow; x.shadowBlur=10;
  x.fillStyle=rad(x,32,32,2,22,[[0,o.light],[.55,o.mid],[1,o.dark]],25,24); x.beginPath(); x.arc(32,32,21,0,7); x.fill(); x.restore();
  x.save(); x.beginPath(); x.arc(32,32,21,0,7); x.clip();
  x.strokeStyle=o.swirl; x.lineWidth=2.2; x.globalAlpha=.65; x.beginPath();
  for(let a=0;a<12;a+=.15){ const r=2+a*1.45; x.lineTo(32+Math.cos(a)*r,32+Math.sin(a)*r); } x.stroke(); x.globalAlpha=1;
  speckle(x,60,'#ffffff',o.seed||3,[11,11,42,42]); x.restore();
  x.strokeStyle='rgba(0,0,0,.75)'; x.lineWidth=1.5; x.beginPath(); x.arc(32,32,21,0,7); x.stroke();
  x.fillStyle='rgba(255,255,255,.85)'; x.beginPath(); x.ellipse(24,22,6.5,3.5,-0.6,0,7); x.fill();
  x.fillStyle='rgba(255,255,255,.35)'; x.beginPath(); x.arc(41,43,3,0,7); x.fill();
});}
function bowArt(o){ return art(x=>{
  diag(x); x.translate(8,0); x.lineCap='round';
  const limb=()=>{ x.beginPath(); x.moveTo(-4,-36); x.quadraticCurveTo(-26,0,-4,36); };
  x.save(); sh(x); limb(); x.strokeStyle='rgba(0,0,0,.85)'; x.lineWidth=7; x.stroke(); x.restore();
  limb(); x.strokeStyle=grad(x,-20,0,-4,0,[[0,shade(o.wood,1.7)],[1,shade(o.wood,.75)]]); x.lineWidth=4.6; x.stroke();
  x.strokeStyle=o.trim; x.lineWidth=1.4; x.setLineDash([3,4]); x.beginPath(); x.moveTo(-5,-30); x.quadraticCurveTo(-23,0,-5,30); x.stroke(); x.setLineDash([]);
  [-34,34].forEach(y=>{ x.fillStyle='#c9a227'; x.beginPath(); x.arc(-4,y,2.2,0,7); x.fill(); });
  x.strokeStyle='rgba(240,240,240,.9)'; x.lineWidth=.9; x.beginPath(); x.moveTo(-4,-36); x.lineTo(-4,36); x.stroke();
  x.fillStyle='#2a1a10'; rr(x,-18,-6,6,12,2); x.fill(); x.strokeStyle='#000'; x.lineWidth=.8; x.stroke();
  gemDot(x,-15,0,3,o.gem);
});}
function maskArt(o){ return art(x=>{
  const face=()=>{ x.beginPath(); x.moveTo(32,6); x.bezierCurveTo(52,6,56,20,54,32); x.bezierCurveTo(52,46,42,58,32,59);
    x.bezierCurveTo(22,58,12,46,10,32); x.bezierCurveTo(8,20,12,6,32,6); x.closePath(); };
  x.save(); sh(x); if(o.aura){ x.shadowColor=o.aura; x.shadowBlur=10; x.shadowOffsetX=0; x.shadowOffsetY=0; }
  face(); x.fillStyle=rad(x,32,28,4,32,[[0,o.light],[.6,o.face],[1,o.dark]],26,20); x.fill(); x.restore();
  x.save(); face(); x.clip();
  speckle(x,320,o.grain,o.seed,[8,4,48,56]);                                      // surface grain
  x.strokeStyle=o.crack; x.lineWidth=.9;
  o.cracks.forEach(c=>{ x.beginPath(); c.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p)); x.stroke(); });
  x.fillStyle=grad(x,0,18,0,27,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.35)']]); x.fillRect(8,18,48,9);   // brow shadow
  x.fillStyle='rgba(255,255,255,.18)'; x.beginPath(); x.ellipse(22,40,5,3,0,0,7); x.ellipse(42,40,5,3,0,0,7); x.fill(); // cheekbones
  x.restore();
  face(); x.strokeStyle='rgba(0,0,0,.85)'; x.lineWidth=1.5; x.stroke();
  [[22,30,1],[42,30,-1]].forEach(([ex,ey,s])=>{
    x.beginPath(); x.ellipse(ex,ey,6.5,4,s*0.25,0,7); x.fillStyle='#050505'; x.fill();
    x.strokeStyle='rgba(255,255,255,.25)'; x.lineWidth=.8; x.beginPath(); x.ellipse(ex,ey+0.8,6.5,4,s*0.25,0.2,2.9); x.stroke();
    x.save(); x.shadowColor=o.eye; x.shadowBlur=9; x.fillStyle=o.eye; x.beginPath(); x.arc(ex,ey,2.1,0,7); x.fill(); x.restore(); });
  x.fillStyle='rgba(0,0,0,.6)'; x.beginPath(); x.moveTo(32,35); x.lineTo(29.5,42); x.lineTo(34.5,42); x.closePath(); x.fill();
  x.strokeStyle=o.mouth; x.lineWidth=1.3; x.beginPath(); x.moveTo(23,49); x.quadraticCurveTo(32,53,41,49); x.stroke();
  for(let i=0;i<5;i++){ x.beginPath(); x.moveTo(25+i*3.5,48.6); x.lineTo(25+i*3.5,53); x.stroke(); }
  x.strokeStyle='rgba(255,255,255,.4)'; x.lineWidth=1.2; x.beginPath(); x.arc(32,32,22,Math.PI*1.1,Math.PI*1.45); x.stroke();
});}
function bookArt(o){ return art(x=>{
  x.save(); sh(x); rr(x,12,8,40,48,3); x.fillStyle=grad(x,12,0,52,0,[[0,shade(o.cover,.6)],[.18,shade(o.cover,1.35)],[1,o.cover]]); x.fill(); x.restore();
  x.save(); rr(x,12,8,40,48,3); x.clip(); speckle(x,260,'#000',11,[12,8,40,48]); speckle(x,80,'#ffffff',12,[18,8,30,48]); x.restore();
  x.fillStyle='#efe6cc'; x.fillRect(48,11,4,42); x.strokeStyle='rgba(120,100,70,.6)'; x.lineWidth=.5;
  for(let y=12;y<53;y+=2){ x.beginPath(); x.moveTo(48,y); x.lineTo(52,y); x.stroke(); }
  x.fillStyle=shade(o.cover,.5); x.fillRect(12,8,6,48); x.fillStyle='#c9a227'; [14,30,46].forEach(y=>x.fillRect(12,y,6,2.5));

  B(L+3*u,top-1.8*u,2*u,2*u,a.boots); glow(()=>R(L+3.5*u,top-1.4*u,u,u,'#ff4fd8'),'#ff4fd8');
  R(L+3.5*u,top,u,3*u,a.boots);                                                      // gold center ridge
  B(L+0.8*u,top+3*u,6.4*u,1.6*u,'#0f3f3c',h/2);                                      // visor slit
  glow(()=>{ R(L+1.6*u,top+3.4*u,1.6*u,0.7*u,a.eyes); R(L+4.8*u,top+3.4*u,1.6*u,0.7*u,a.eyes); },a.eyes);
  B(L,top+5.4*u,8*u,1.4*u,a.boots,h/2);                                              // gold band
  ['#ff3b5c','#3bff8a','#3b8bff','#ffb030','#b05cff'].forEach((c,i)=>glow(()=>R(L+(0.6+i*1.5)*u,top+5.7*u,0.8*u,0.8*u,c),c));
  R(L,top+7*u,8*u,u,shade(a.helm,0.6));
}
 
function player(cx,base,u,a,item,name,nameCol){
  const top=base-32*u, L=cx-4*u, h=u/2, st=a.style; PX=u;
  g.fillStyle='rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(cx,base,11*u,2.2*u,0,0,7); g.fill();
 
  // ----- legs -----
  B(L,top+20*u,4*u,12*u,a.legs); B(L+4*u,top+20*u,4*u,12*u,shade(a.legs,0.9));
  B(L+h,top+23*u,3*u,2*u,a.trim); B(L+4*u+h,top+23*u,3*u,2*u,a.trim);            // knee plates
  B(L,top+28*u,4*u,4*u,a.boots); B(L+4*u,top+28*u,4*u,4*u,shade(a.boots,0.9));    // boots
  R(L,top+31*u,8*u,h,shade(a.boots,0.5)); R(L+h,top+28*u,3*u,h,a.trim); R(L+4*u+h,top+28*u,3*u,h,a.trim);
 
  // ----- arms + gauntlets -----
  for(const ax of [L-4*u,L+8*u]){
    B(ax,top+8*u,4*u,12*u,a.chest2||a.chest);
    R(ax+h,top+13*u,3*u,h,shade(a.chest,0.6));                                   // elbow seam
    B(ax,top+16*u,4*u,4*u,a.boots);                                               // gauntlet
    R(ax,top+16*u,4*u,h,a.trim);
  }
 
  // ----- torso -----
  B(L,top+8*u,8*u,12*u,a.chest);
  B(L+u,top+9*u,6*u,5*u,a.chest2||shade(a.chest,0.85));                           // chest plate
  for(let i=0;i<3;i++) R(L+u,top+(15+i*1.2)*u,6*u,h/2,shade(a.chest,0.65));      // ab plates
  B(L,top+18*u,8*u,1.5*u,a.belt||shade(a.boots,0.8));                             // belt
  B(L+3*u,top+18*u,2*u,1.5*u,a.trim);                                             // buckle
  // emblem gem
  glow(()=>{ R(L+3.5*u,top+10*u,u,u,a.gem); R(L+3*u,top+10.5*u,2*u,h/1,a.gem); R(L+3.5*u,top+10*u,h,h,'#fff'); },a.gem);
 
  // ----- pauldrons -----
  for(const [px,dir] of [[L-5*u,-1],[L+8*u,1]]){
    B(px,top+7*u,5*u,3*u,a.trim);
    R(px+h,top+9*u,4*u,h,shade(a.trim,0.6));
    R(px+(dir<0?h:3.5*u),top+7.5*u,h,h,shade(a.trim,1.4));                        // rivet
    if(st==='necron') miniSkull(px+u,top+4.6*u,u);                                 // tiny wither skull on each shoulder
  }
  if(st==='necron') miniSkull(L+2.5*u,top+9.2*u,u);                                 // and one on the chest
 
  // ----- set-specific body details -----
  if(st==='shark'){
    B(L+2*u,top+14*u,4*u,3.5*u,'#dfe9f5');                                         // pale belly
    scales(L,top+8*u,2*u,10*u,a.chest,u); scales(L+6*u,top+8*u,2*u,10*u,a.chest,u);
    scales(L-4*u,top+10*u,4*u,6*u,a.chest2,u); scales(L+8*u,top+10*u,4*u,6*u,a.chest2,u);
    scales(L,top+20*u,8*u,8*u,a.legs,u);
  }
  if(st==='divan'){
    [['#3bff8a',L+1.2*u,top+15*u],['#ffb030',L+5.8*u,top+15*u],['#ff3b5c',L+1.2*u,top+11*u],['#b05cff',L+5.8*u,top+11*u]]
      .forEach(([c,x,y])=>glow(()=>{R(x,y,u,u,c); R(x,y,h/2,h/2,'#fff');},c));
    R(L+3.75*u,top+20*u,h,8*u,a.boots);                                             // gold leg trim
  }
 
  // ----- helmets: a different shape for each set -----
  if(st==='necron')      necronHelm(L,top,u,h);
  else if(st==='shark')  sharkHelm(L,top,u,h,a);
  else if(st==='divan')  divanHelm(L,top,u,h,a);
  else {
    B(L,top,8*u,8*u,a.helm);
    B(L,top+3*u,8*u,2*u,a.visor,h);
    glow(()=>{ R(L+u,top+3.5*u,2*u,u,a.eyes); R(L+5*u,top+3.5*u,2*u,u,a.eyes); },a.eyes);
    R(L+3.5*u,top+5*u,u,2.5*u,shade(a.helm,0.7));
    R(L,top+7*u,8*u,h,shade(a.helm,0.55));
    if(st==='goldor'){ B(L+3*u,top-2*u,2*u,3*u,a.trim); R(L,top,8*u,h,a.trim);
      for(let k=0;k<4;k++) R(L+(k*2+0.75)*u,top+1.5*u,h,h,shade(a.trim,1.3)); }
  }
 
  // held item (right hand = viewer's left)
  // mirrored so the blade points up and out, with the grip landing in the fist
  if(item){ const S=20*u, hx=L-2*u, hy=top+18.5*u;
    g.save(); g.imageSmoothingEnabled=true; g.translate(hx+0.28*S,hy-0.72*S); g.scale(-1,1);
    g.drawImage(item,0,0,S,S); g.restore();
    // fist wrapped over the grip
    B(L-4.5*u,top+17*u,5*u,3*u,a.boots); R(L-4.5*u,top+17*u,5*u,h,a.trim);
    for(let f=0;f<3;f++) R(L-4*u+f*1.4*u,top+18.6*u,h/2,1.2*u,shade(a.boots,0.55)); }
  // nameplate
  g.font=`bold ${Math.max(14,3*u)}px Courier New`; g.textAlign='center';
  const w=g.measureText(name).width+12; R(cx-w/2,top-7*u,w,4.2*u,'rgba(0,0,0,.4)');
  g.fillStyle=nameCol; g.fillText(name,cx,top-3.8*u);
}

player(840,474,6,{style:'shark',helm:'#3a6fd6',visor:'#16326b',chest:'#4b86ee',chest2:'#3a6fd6',legs:'#3a6fd6',boots:'#22468f',trim:'#7fb6ff',eyes:'#a8f0ff',gem:'#a8f0ff'},chalRod,'Doggy','#5599ff');
